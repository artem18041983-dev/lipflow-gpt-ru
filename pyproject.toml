[project]
name = "lipflow"
version = "0.1.0"
description = "Silent RU/EN dictation from lip movement with Sign in with ChatGPT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe==0.10.21",
    "numpy<2",
    "opencv-python>=4.9,<4.11",
    "pillow>=10",
    "keyring>=25.6",
    "pyjwt[crypto]>=2.10",
    "pynput>=1.7.7",
    "pystray>=0.19; sys_platform == 'win32'",
    "requests>=2.31",
]

[project.optional-dependencies]
legacy = [
    "anthropic>=0.40",
    "av>=18.1.0",
    "mlx-lm>=0.31.3; sys_platform == 'darwin'",
    "pyobjc-framework-avfoundation>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=10.3; sys_platform == 'darwin'",
    "sentencepiece>=0.2.2",
    "sounddevice>=0.5.6",
    "torch>=2.4",
]

[project.scripts]
lipflow = "lipflow.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lipflow", "espnet"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
